name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI-only credentials for a service that lives for this job only.
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KIEN_TEST_POSTGRES_URL: postgresql+psycopg://synthetic:synthetic-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
      - name: Postgres tests must run, not skip
        run: |
          uv run pytest -v -rs tests/test_*_postgres.py | tee postgres-tests.log
          if grep -q SKIPPED postgres-tests.log; then echo "Postgres tests were skipped"; exit 1; fi
          grep -E "[0-9]+ passed" postgres-tests.log

  web:
    name: Web lint, typecheck, and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:cloudflare
        env:
          NEXT_PUBLIC_USE_MOCKS: "true"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-browser-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  web-live:
    name: Web journeys on the real backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Synthetic users on a throwaway SQLite file (scripts/e2e_backend.py); no secrets.
      - run: npm run test:e2e:live
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-browser-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
