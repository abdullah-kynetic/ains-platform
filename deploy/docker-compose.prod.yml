# Production stack for the single Kien VPS (compose project "kien", directory /opt/kien/deploy).
# Run through deploy/deploy.sh, or by hand:
#   docker compose -p kien --env-file /etc/kien/compose.env -f deploy/docker-compose.prod.yml up -d
#
# Secrets are split per service so each container only gets what it needs (all files root, mode 600;
# variable NAMES only in deploy/env/*.example):
#   /etc/kien/compose.env   compose interpolation only, no secrets: KIEN_IMAGE, API_HOST
#   /etc/kien/postgres.env  postgres only: POSTGRES_USER/PASSWORD/DB (bootstrap superuser)
#   /etc/kien/migrate.env   migrate only: DATABASE_URL as kien_migrator (schema owner)
#   /etc/kien/app.env       api + worker: DATABASE_URL as kien_app (DML only), session, CORS,
#                           R2 storage and Resend keys
#   /etc/kien/ai.env        ai-adapter only (profile "ai", AI_ENABLED=false until Stage 3)
# ClamAV and Caddy get no env file at all, so they never see storage, email or DB secrets.
#
# Memory is tuned for the 3.7 GiB VPS. Long-running limits: postgres 768 + clamav 1200 + api 512 +
# worker 384 + caddy 128 (+ ai-adapter 256 when enabled) = 2992m (3248m with AI). migrate (384m)
# is one-shot and exits before api/worker start.
# Only Caddy publishes ports. KIEN_IMAGE is the host-built tag kien-api:sha-<12> (build-on-host.sh).

name: kien

x-app: &app
  image: ${KIEN_IMAGE:?set KIEN_IMAGE (kien-api:sha-<12>)}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    # TODO(deploy): pin by digest (postgres:16@sha256:...) once recorded in deploy/RELEASES.md.
    image: postgres:16
    restart: unless-stopped
    env_file: /etc/kien/postgres.env
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=30"]
    shm_size: 128m
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    env_file: /etc/kien/migrate.env
    command: ["alembic", "upgrade", "head"]
    environment:
      RUN_MIGRATIONS: "0" # the command above is the migration; skip the entrypoint's
    networks: [backend]
    mem_limit: 384m
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    env_file: /etc/kien/app.env
    environment:
      RUN_MIGRATIONS: "0"
      ENV: production # the app refuses to start unless scanning is on
      UPLOAD_SCAN_MODE: clamav
      SESSION_COOKIE_SECURE: "true" # the app also refuses to start in production without it
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      UPLOAD_MAX_CONCURRENT: "2" # each upload is buffered (up to 100 MB); keep inside 512m
    # Trust X-Forwarded-For only from Caddy's pinned address; spoofed headers from elsewhere are ignored.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.30.0.2
    expose: ["8000"]
    mem_limit: 512m
    networks: [backend, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    env_file: /etc/kien/app.env
    environment:
      RUN_MIGRATIONS: "0"
      ENV: production
      UPLOAD_SCAN_MODE: clamav
      SESSION_COOKIE_SECURE: "true"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    command: ["python", "-m", "app.worker", "--poll-seconds", "2"]
    mem_limit: 384m
    networks: [backend, edge]
    depends_on:
      migrate: {condition: service_completed_successfully}

  ai-adapter:
    # Defined but OFF: only starts with `--profile ai`, and AI_ENABLED=false blocks every call anyway.
    <<: *app
    profiles: ["ai"]
    env_file: /etc/kien/ai.env
    environment:
      RUN_MIGRATIONS: "0"
      AI_ENABLED: "false"
    command:
      - python
      - -c
      - "import uvicorn; from ai_adapter.service import create_service; from ai_adapter.settings import AdapterSettings; uvicorn.run(create_service(AdapterSettings()), host='0.0.0.0', port=8100)"
    expose: ["8100"]
    mem_limit: 256m
    volumes:
      - ai_state:/var/lib/kien-ai
    networks: [backend, edge]

  clamav:
    # Malware scanner for uploads. ConcurrentDatabaseReload=no stops clamd holding two signature
    # databases in memory during reloads (the main reason it would otherwise need ~2.4 GB).
    # TODO(deploy): pin by digest once recorded in deploy/RELEASES.md.
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 100M # must cover the 100 MB upload cap, or large uploads fail closed
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    mem_limit: 1200m
    security_opt: ["no-new-privileges:true"]
    volumes:
      - clamav_db:/var/lib/clamav
    networks: [backend, edge] # edge only so freshclam can fetch signature updates
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  caddy:
    # TODO(deploy): pin by digest once recorded in deploy/RELEASES.md.
    image: caddy:2
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?set API_HOST in /etc/kien/compose.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        ipv4_address: 172.30.0.2
    depends_on:
      api: {condition: service_healthy}

networks:
  backend:
    internal: true # Postgres has no route to the internet
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic addresses come only from .128-.255, so Caddy's pinned .2 is never taken first
          # by clamav/api/worker (that race made Caddy fail with "Address already in use").
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  clamav_db:
  ai_state:
